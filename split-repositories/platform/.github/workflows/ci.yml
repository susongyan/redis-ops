name: platform

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          server-id: redis-ops-contract
          server-username: MAVEN_REGISTRY_USERNAME
          server-password: MAVEN_REGISTRY_PASSWORD
      - name: Verify Platform
        env:
          MAVEN_REGISTRY_URL: ${{ secrets.MAVEN_REGISTRY_URL }}
          MAVEN_REGISTRY_USERNAME: ${{ secrets.MAVEN_REGISTRY_USERNAME }}
          MAVEN_REGISTRY_PASSWORD: ${{ secrets.MAVEN_REGISTRY_PASSWORD }}
        run: mvn --settings .mvn/settings.xml --batch-mode --no-transfer-progress clean verify
