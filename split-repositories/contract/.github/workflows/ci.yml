name: sync-contract

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: mvn --batch-mode --no-transfer-progress clean verify

  publish:
    if: github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          server-id: redis-ops-contract
          server-username: MAVEN_REGISTRY_USERNAME
          server-password: MAVEN_REGISTRY_PASSWORD
      - name: Check Maven Registry configuration
        env:
          MAVEN_REGISTRY_URL: ${{ secrets.MAVEN_REGISTRY_URL }}
        run: test -n "${MAVEN_REGISTRY_URL}"
      - name: Publish immutable contract artifact
        env:
          MAVEN_REGISTRY_URL: ${{ secrets.MAVEN_REGISTRY_URL }}
          MAVEN_REGISTRY_USERNAME: ${{ secrets.MAVEN_REGISTRY_USERNAME }}
          MAVEN_REGISTRY_PASSWORD: ${{ secrets.MAVEN_REGISTRY_PASSWORD }}
        run: >-
          mvn --batch-mode --no-transfer-progress clean deploy
          -DaltDeploymentRepository=redis-ops-contract::${MAVEN_REGISTRY_URL}
