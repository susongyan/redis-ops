name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  platform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Verify Platform modules
        run: mvn -B -f redis-ops-sync-contract/pom.xml install && ./scripts/build-platform.sh

  sync-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Verify Sync Worker modules
        run: mvn -B -f redis-ops-sync-contract/pom.xml install && ./scripts/build-sync-worker.sh

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: redis-ops-frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: redis-ops-frontend
        run: npm ci
      - name: Build frontend
        working-directory: redis-ops-frontend
        run: npm run build
