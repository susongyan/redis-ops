logging:
  file:
    name: ${LOG_DIR:./log}/platform.log
  level:
    root: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSSXXX} %5p [${spring.application.name}] [pid=${PID:-}] [%t] %logger{48} - %msg%n%wEx"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSSXXX} %5p [${spring.application.name}] [pid=${PID:-}] [%t] %logger{48} - %msg%n%wEx"
  logback:
    rollingpolicy:
      file-name-pattern: "${LOG_DIR:./log}/archive/platform.%d{yyyy-MM-dd}.%i.log.gz"
      max-file-size: 20MB
      max-history: 14
      total-size-cap: 1GB
      clean-history-on-start: true
spring:
  profiles:
    default: dev
  # Spring Config Data is the single configuration entry point. External
  # Apollo additionally requires its Config Data adapter; see docs/apollo-integration.md.
  config:
    import: optional:file:./config/

  application:
    name: redis-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/redis_governance?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${DB_USERNAME:redis_governance}
    password: ${DB_PASSWORD:redis_governance}
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
mybatis:
  configuration:
    map-underscore-to-camel-case: true
identity:
  # No built-in password. Required only before first successful initialization.
  bootstrap:
    username: admin
    password: ""
  cookie-secure: true
distribution:
  # On-demand only; no periodic full scans. Values may be tightened, not enlarged.
  concurrent-tasks: 1
  max-duration-seconds: 21600
  max-scan-count: 5000
  min-scan-interval-ms: 10
  max-groups: 1000
  max-response-bytes: 1048576
  max-response-elements: 5000
  max-key-bytes: 4096
  max-shards: 256
  connect-timeout-ms: 2000
  command-timeout-ms: 3000
management:
  endpoints.web.exposure.include: health,info,prometheus
collector:
  enabled: ${COLLECTOR_ENABLED:true}
  fast-interval-ms: ${COLLECTOR_FAST_INTERVAL_MS:15000}
  page-size: ${COLLECTOR_PAGE_SIZE:200}
platform:
  jobs:
    # Platform jobs and credential re-encryption; not the independent Sync Worker.
    enabled: ${PLATFORM_JOBS_ENABLED:true}
    instance-id: ${PLATFORM_JOBS_INSTANCE_ID:${HOSTNAME:local-platform}}
    discovery:
      poll-interval-ms: ${PLATFORM_JOBS_DISCOVERY_POLL_INTERVAL_MS:1000}
    risk-scan:
      poll-interval-ms: 1000
    validation:
      poll-interval-ms: 1000
    ttl-governance:
      poll-interval-ms: 1000
    cleanup-governance:
      poll-interval-ms: 1000
redis-ops:
  analysis:
    http:
      # Optional. Empty means the deterministic rule provider is used.
      endpoint: ${REDIS_OPS_ANALYSIS_HTTP_ENDPOINT:}
      timeout-ms: ${REDIS_OPS_ANALYSIS_HTTP_TIMEOUT_MS:5000}
      types: ${REDIS_OPS_ANALYSIS_HTTP_TYPES:ALERT,SYNC,VALIDATION,RISK_SCAN,INCIDENT}
    acp:
      # Optional ACP REST base. The adapter probes manifest-path before submitting run-path.
      endpoint: ${REDIS_OPS_ANALYSIS_ACP_ENDPOINT:}
      manifest-path: ${REDIS_OPS_ANALYSIS_ACP_MANIFEST_PATH:/manifest}
      run-path: ${REDIS_OPS_ANALYSIS_ACP_RUN_PATH:/runs}
      timeout-ms: ${REDIS_OPS_ANALYSIS_ACP_TIMEOUT_MS:10000}
      types: ${REDIS_OPS_ANALYSIS_ACP_TYPES:ALERT,SYNC,VALIDATION,RISK_SCAN,INCIDENT}
  credential:
    # Supplied by external Spring configuration; no default key is permitted.
    keys: ${REDIS_OPS_CREDENTIAL_KEYS:}
    rotation-batch-size: ${CREDENTIAL_ROTATION_BATCH_SIZE:50}
