<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760">
  <defs>
    <style>
      .title{font:700 27px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#172033}
      .subtitle{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#667085}
      .label{font:700 14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#172033;text-anchor:middle}
      .small{font:12px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#667085;text-anchor:middle}
      .arrow{stroke:#667085;stroke-width:2;fill:none;marker-end:url(#arrow)}
      .return{stroke:#2E90FA;stroke-width:2;fill:none;stroke-dasharray:7 5;marker-end:url(#blueArrow)}
      .error{stroke:#D92D20;stroke-width:2;fill:none;marker-end:url(#redArrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#667085"/>
    </marker>
    <marker id="blueArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#2E90FA"/>
    </marker>
    <marker id="redArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#D92D20"/>
    </marker>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#101828" flood-opacity=".13"/>
    </filter>
  </defs>
  <rect width="1500" height="760" fill="#F8FAFC"/>
  <text x="45" y="48" class="title">同步任务业务状态生命周期</text>
  <text x="45" y="74" class="subtitle">蓝色虚线表示持续同步中的回流；红色路径表示运行时阻塞或失败；FINISHED/CANCELLED 为终态</text>

  <g filter="url(#shadow)">
    <rect x="45" y="125" width="125" height="62" rx="31" fill="#FFFFFF" stroke="#98A2B3" stroke-width="2"/>
    <text x="108" y="153" class="label">CREATED</text><text x="108" y="173" class="small">已创建</text>

    <rect x="215" y="125" width="125" height="62" rx="31" fill="#EEF4FF" stroke="#84ADFF" stroke-width="2"/>
    <text x="278" y="153" class="label">CHECKING</text><text x="278" y="173" class="small">预检查中</text>

    <rect x="385" y="125" width="125" height="62" rx="31" fill="#ECFDF3" stroke="#6CE9A6" stroke-width="2"/>
    <text x="448" y="153" class="label">READY</text><text x="448" y="173" class="small">可启动</text>

    <rect x="555" y="125" width="125" height="62" rx="31" fill="#FFF7ED" stroke="#FDB022" stroke-width="2"/>
    <text x="618" y="153" class="label">STARTING</text><text x="618" y="173" class="small">准备目标</text>

    <rect x="725" y="125" width="145" height="62" rx="31" fill="#F0F9FF" stroke="#36BFFA" stroke-width="2"/>
    <text x="798" y="153" class="label">FULL_SYNCING</text><text x="798" y="173" class="small">全量同步</text>

    <rect x="915" y="125" width="145" height="62" rx="31" fill="#F0F9FF" stroke="#36BFFA" stroke-width="2"/>
    <text x="988" y="153" class="label">INCR_SYNCING</text><text x="988" y="173" class="small">增量同步</text>

    <rect x="1105" y="125" width="135" height="62" rx="31" fill="#ECFDF3" stroke="#12B76A" stroke-width="2"/>
    <text x="1173" y="153" class="label">CAUGHT_UP</text><text x="1173" y="173" class="small">已经追平</text>
  </g>

  <path d="M170 156 L215 156" class="arrow"/>
  <path d="M340 156 L385 156" class="arrow"/>
  <path d="M510 156 L555 156" class="arrow"/>
  <path d="M680 156 L725 156" class="arrow"/>
  <path d="M870 156 L915 156" class="arrow"/>
  <path d="M1060 156 L1105 156" class="arrow"/>
  <path d="M1173 125 C1173 85 988 85 988 125" class="return"/>
  <text x="1080" y="97" class="small">源端产生新写入</text>

  <g filter="url(#shadow)">
    <rect x="725" y="300" width="135" height="62" rx="31" fill="#FFFAEB" stroke="#FEC84B" stroke-width="2"/>
    <text x="793" y="328" class="label">PAUSING</text><text x="793" y="348" class="small">停止目标应用</text>

    <rect x="915" y="300" width="125" height="62" rx="31" fill="#FFFAEB" stroke="#FEC84B" stroke-width="2"/>
    <text x="978" y="328" class="label">PAUSED</text><text x="978" y="348" class="small">应用已暂停</text>

    <rect x="1105" y="300" width="135" height="62" rx="31" fill="#EEF4FF" stroke="#84ADFF" stroke-width="2"/>
    <text x="1173" y="328" class="label">RESUMING</text><text x="1173" y="348" class="small">恢复校验</text>

    <rect x="1270" y="300" width="135" height="62" rx="31" fill="#FFF7ED" stroke="#FDB022" stroke-width="2"/>
    <text x="1338" y="328" class="label">STOPPING</text><text x="1338" y="348" class="small">最终追平</text>
  </g>

  <path d="M988 187 C988 245 793 245 793 300" class="arrow"/>
  <path d="M793 362 C793 405 978 405 978 362" class="arrow"/>
  <path d="M1040 331 L1105 331" class="arrow"/>
  <path d="M1173 300 C1173 245 988 245 988 187" class="return"/>
  <path d="M1173 187 C1173 245 1338 245 1338 300" class="arrow"/>

  <g filter="url(#shadow)">
    <rect x="380" y="505" width="140" height="66" rx="12" fill="#FFF1F3" stroke="#FDA4AF" stroke-width="2"/>
    <text x="450" y="534" class="label">BLOCKED</text><text x="450" y="554" class="small">等待人工决策</text>

    <rect x="590" y="505" width="140" height="66" rx="12" fill="#FEF3F2" stroke="#FDA29B" stroke-width="2"/>
    <text x="660" y="534" class="label">FAILED</text><text x="660" y="554" class="small">本轮执行失败</text>

    <rect x="1005" y="505" width="140" height="66" rx="12" fill="#ECFDF3" stroke="#6CE9A6" stroke-width="2"/>
    <text x="1075" y="534" class="label">FINISHED</text><text x="1075" y="554" class="small">正常结束</text>

    <rect x="1215" y="505" width="140" height="66" rx="12" fill="#F2F4F7" stroke="#98A2B3" stroke-width="2"/>
    <text x="1285" y="534" class="label">CANCELLED</text><text x="1285" y="554" class="small">操作人取消</text>
  </g>

  <path d="M1338 362 C1338 450 1075 450 1075 505" class="arrow"/>
  <path d="M618 187 C618 420 450 420 450 505" class="error"/>
  <path d="M798 187 C798 420 450 420 450 505" class="error"/>
  <path d="M988 187 C988 440 660 440 660 505" class="error"/>
  <path d="M1173 362 C1173 445 660 445 660 505" class="error"/>
  <path d="M450 505 C450 440 278 440 278 187" class="return"/>
  <text x="346" y="423" class="small">重新预检查</text>
  <path d="M660 505 C660 420 278 420 278 187" class="return"/>

  <path d="M108 187 C108 650 1285 650 1285 571" class="arrow"/>
  <path d="M978 362 C978 620 1285 620 1285 571" class="arrow"/>
  <text x="700" y="688" class="small">除 FINISHED/CANCELLED 外，允许按状态机执行取消；取消不回滚已写入目标的数据</text>
</svg>
