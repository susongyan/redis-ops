<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="840" viewBox="0 0 1400 840">
  <defs>
    <style>
      .title{font:700 28px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#172033}
      .subtitle{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#667085}
      .section{font:700 18px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#172033}
      .box-title{font:700 16px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#172033}
      .text{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#344054}
      .small{font:12px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#667085}
      .line{stroke:#667085;stroke-width:2;fill:none;marker-end:url(#arrow)}
      .dash{stroke:#98A2B3;stroke-width:2;stroke-dasharray:7 6;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#667085"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#101828" flood-opacity=".12"/>
    </filter>
  </defs>

  <rect width="1400" height="840" fill="#F8FAFC"/>
  <text x="52" y="50" class="title">Redis 同步 Worker 管理与执行架构</text>
  <text x="52" y="76" class="subtitle">管理面产生可靠控制意图，数据面持有运行租约并执行复制；密码不进入控制命令和网络接口</text>

  <rect x="45" y="105" width="1310" height="190" rx="18" fill="#EEF4FF" stroke="#84ADFF" stroke-width="2"/>
  <text x="68" y="135" class="section">Platform 管理面</text>

  <g filter="url(#shadow)">
    <rect x="75" y="160" width="225" height="100" rx="12" fill="#FFFFFF" stroke="#B2CCFF"/>
    <text x="95" y="190" class="box-title">Web / Open API</text>
    <text x="95" y="216" class="text">任务配置、操作确认</text>
    <text x="95" y="239" class="text">状态、指标和审计展示</text>

    <rect x="350" y="160" width="290" height="100" rx="12" fill="#FFFFFF" stroke="#B2CCFF"/>
    <text x="370" y="190" class="box-title">Sync Application Service</text>
    <text x="370" y="216" class="text">状态机、幂等、If-Match</text>
    <text x="370" y="239" class="text">预检查/启动/暂停/结束意图</text>

    <rect x="690" y="160" width="260" height="100" rx="12" fill="#FFFFFF" stroke="#B2CCFF"/>
    <text x="710" y="190" class="box-title">Switchover Workflow</text>
    <text x="710" y="216" class="text">RPO 门禁、source fence</text>
    <text x="710" y="239" class="text">外部切流确认、关系交换</text>

    <rect x="1000" y="160" width="315" height="100" rx="12" fill="#FFFFFF" stroke="#B2CCFF"/>
    <text x="1020" y="190" class="box-title">Audit / Idempotency</text>
    <text x="1020" y="216" class="text">操作人、事件、请求去重</text>
    <text x="1020" y="239" class="text">不记录密码、Key 和 Value</text>
  </g>

  <rect x="45" y="330" width="1310" height="155" rx="18" fill="#F2F4F7" stroke="#98A2B3" stroke-width="2"/>
  <text x="68" y="361" class="section">共享 MySQL：首期可靠控制与低频运行摘要</text>

  <g filter="url(#shadow)">
    <rect x="75" y="385" width="210" height="68" rx="11" fill="#FFFFFF" stroke="#D0D5DD"/>
    <text x="95" y="414" class="box-title">sync_task</text>
    <text x="95" y="437" class="small">配置、期望动作、业务状态</text>

    <rect x="315" y="385" width="210" height="68" rx="11" fill="#FFFFFF" stroke="#D0D5DD"/>
    <text x="335" y="414" class="box-title">async_job</text>
    <text x="335" y="437" class="small">控制命令、短租约、重试</text>

    <rect x="555" y="385" width="210" height="68" rx="11" fill="#FFFFFF" stroke="#D0D5DD"/>
    <text x="575" y="414" class="box-title">sync_runtime</text>
    <text x="575" y="437" class="small">执行实例、租约、generation</text>

    <rect x="795" y="385" width="240" height="68" rx="11" fill="#FFFFFF" stroke="#D0D5DD"/>
    <text x="815" y="414" class="box-title">channel / metric</text>
    <text x="815" y="437" class="small">offset、RPO、运行摘要</text>

    <rect x="1065" y="385" width="250" height="68" rx="11" fill="#FFFFFF" stroke="#D0D5DD"/>
    <text x="1085" y="414" class="box-title">asset / cluster_secret</text>
    <text x="1085" y="437" class="small">集群只读、密码本地解密</text>
  </g>

  <rect x="45" y="520" width="850" height="275" rx="18" fill="#ECFDF3" stroke="#6CE9A6" stroke-width="2"/>
  <text x="68" y="551" class="section">governance-sync-service 数据面</text>

  <g filter="url(#shadow)">
    <rect x="75" y="580" width="190" height="84" rx="11" fill="#FFFFFF" stroke="#75E0A7"/>
    <text x="95" y="609" class="box-title">Control Consumer</text>
    <text x="95" y="633" class="small">领取 Job、命令续租</text>
    <text x="95" y="651" class="small">幂等确认执行结果</text>

    <rect x="295" y="580" width="190" height="84" rx="11" fill="#FFFFFF" stroke="#75E0A7"/>
    <text x="315" y="609" class="box-title">Runner Manager</text>
    <text x="315" y="633" class="small">运行租约、并发控制</text>
    <text x="315" y="651" class="small">暂停、接管、优雅停机</text>

    <rect x="515" y="580" width="190" height="84" rx="11" fill="#FFFFFF" stroke="#75E0A7"/>
    <text x="535" y="609" class="box-title">Channel Runner</text>
    <text x="535" y="633" class="small">PSYNC、RDB、增量流</text>
    <text x="535" y="651" class="small">Sentinel / Cluster 通道</text>

    <rect x="735" y="580" width="130" height="84" rx="11" fill="#FFFFFF" stroke="#75E0A7"/>
    <text x="755" y="609" class="box-title">Metrics</text>
    <text x="755" y="633" class="small">RPO / offset</text>
    <text x="755" y="651" class="small">Prometheus</text>

    <rect x="185" y="700" width="250" height="66" rx="11" fill="#FFFFFF" stroke="#75E0A7"/>
    <text x="205" y="728" class="box-title">Encrypted Local Spool</text>
    <text x="205" y="750" class="small">segment、fsync、CRC、manifest</text>

    <rect x="505" y="700" width="250" height="66" rx="11" fill="#FFFFFF" stroke="#75E0A7"/>
    <text x="525" y="728" class="box-title">Target Applier</text>
    <text x="525" y="750" class="small">RESTORE / 命令 + 原子 checkpoint</text>
  </g>

  <rect x="940" y="520" width="415" height="275" rx="18" fill="#FFF7ED" stroke="#FDB022" stroke-width="2"/>
  <text x="963" y="551" class="section">Redis 数据源与目标</text>
  <g filter="url(#shadow)">
    <rect x="975" y="585" width="150" height="100" rx="12" fill="#FFFFFF" stroke="#FEC84B"/>
    <text x="995" y="615" class="box-title">源 Redis</text>
    <text x="995" y="640" class="small">Standalone</text>
    <text x="995" y="659" class="small">Sentinel / Cluster</text>

    <rect x="1170" y="585" width="150" height="100" rx="12" fill="#FFFFFF" stroke="#FEC84B"/>
    <text x="1190" y="615" class="box-title">目标 Redis</text>
    <text x="1190" y="640" class="small">业务数据</text>
    <text x="1190" y="659" class="small">最终 checkpoint</text>
  </g>
  <text x="975" y="726" class="text">业务流量入口由外部系统管理</text>
  <text x="975" y="750" class="small">平台仅等待写隔离与切流确认</text>

  <path d="M300 210 L350 210" class="line"/>
  <path d="M640 210 L690 210" class="line"/>
  <path d="M950 210 L1000 210" class="line"/>
  <path d="M495 260 L495 330" class="line"/>
  <path d="M690 485 L690 520" class="line"/>
  <path d="M420 453 L170 580" class="dash"/>
  <path d="M645 453 L390 580" class="dash"/>
  <path d="M1185 453 L610 580" class="dash"/>
  <path d="M265 622 L295 622" class="line"/>
  <path d="M485 622 L515 622" class="line"/>
  <path d="M610 664 L610 700" class="line"/>
  <path d="M515 642 L420 700" class="line"/>
  <path d="M975 635 L865 635" class="line"/>
  <path d="M755 733 L1170 685" class="line"/>

  <text x="875" y="615" class="small">PSYNC</text>
  <text x="932" y="700" class="small">目标写入</text>
</svg>
