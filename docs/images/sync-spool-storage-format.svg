<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
  <title id="title">Redis 同步加密 Spool 的文件格式与恢复读取流程</title>
  <desc id="desc">展示按任务和通道组织的本地目录、全量 RDB 加密文件、命令分段记录格式、写入 fsync、恢复扫描和安全失败分支。</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #172033; }
      .title { font-size: 29px; font-weight: 700; } .subtitle { font-size: 14px; fill: #526174; }
      .section { font-size: 18px; font-weight: 700; } .head { font-size: 15px; font-weight: 700; }
      .body { font-size: 13px; } .small { font-size: 12px; fill: #526174; } .tiny { font-size: 11px; fill: #617188; }
      .canvas { fill: #f4f7fb; } .panel { fill: #fff; stroke: #c7d4e5; stroke-width: 1.4; }
      .write { fill: #fff8ec; stroke: #e7b758; stroke-width: 1.8; } .disk { fill: #eef5ff; stroke: #7e9fe1; stroke-width: 1.8; }
      .read { fill: #effaf4; stroke: #69ba8d; stroke-width: 1.8; } .recover { fill: #f8f2ff; stroke: #a68ad9; stroke-width: 1.8; }
      .node { fill: #fff; stroke: #aec0d4; stroke-width: 1.2; } .node-orange { fill: #fffaf1; stroke: #dfa950; stroke-width: 1.2; }
      .node-blue { fill: #f5f8ff; stroke: #89a8e2; stroke-width: 1.2; } .node-green { fill: #f5fcf8; stroke: #76bc94; stroke-width: 1.2; }
      .node-purple { fill: #fbf8ff; stroke: #aa8fda; stroke-width: 1.2; } .node-red { fill: #fff3f2; stroke: #db7a72; stroke-width: 1.2; }
      .arrow { fill:none; stroke:#396cc5; stroke-width:1.55; marker-end:url(#arrow); } .arrow-orange { fill:none; stroke:#b97519; stroke-width:1.55; marker-end:url(#arrowOrange); }
      .arrow-green { fill:none; stroke:#288a58; stroke-width:1.55; marker-end:url(#arrowGreen); } .arrow-purple { fill:none; stroke:#7c61b3; stroke-width:1.55; marker-end:url(#arrowPurple); }
      .dash { fill:none; stroke:#708096; stroke-width:1.3; stroke-dasharray:6 5; marker-end:url(#arrowGray); }
      .divider { stroke:#c9d5e5; stroke-width:1.15; stroke-dasharray:5 5; } .file { fill:#fff; stroke:#7e9fe1; stroke-width:1.35; }
      .file-head { fill:#dfeaff; stroke:#7e9fe1; stroke-width:1.35; } .tag { stroke-width:1; } .warn { fill:#fff0ca; stroke:#d9aa3b; } .bad { fill:#fee4e1; stroke:#dd7770; }
    </style>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7z" fill="#396cc5"/></marker>
    <marker id="arrowOrange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7z" fill="#b97519"/></marker>
    <marker id="arrowGreen" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7z" fill="#288a58"/></marker>
    <marker id="arrowPurple" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7z" fill="#7c61b3"/></marker>
    <marker id="arrowGray" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7z" fill="#708096"/></marker>
  </defs>
  <rect width="1600" height="1100" class="canvas"/>
  <text x="42" y="48" class="title">Sync Worker 加密 Spool：文件格式、分段写入与恢复读取</text>
  <text x="42" y="73" class="subtitle">当前实现：本地持久盘、AES-256-GCM、单条增量命令 fsync、按分段文件名排序恢复；未实现 command manifest。</text>

  <!-- directory -->
  <rect x="42" y="102" width="1516" height="184" rx="16" class="disk"/>
  <text x="65" y="135" class="section">① 每个任务 / 通道的本地目录</text>
  <text x="65" y="158" class="small">Standalone 使用 &lt;dataDir&gt;/&lt;taskId&gt;/；Cluster 在其下再按 channel 名称分目录。</text>
  <g transform="translate(76 180)">
    <rect x="0" y="0" width="990" height="76" rx="9" class="node-blue"/>
    <text x="18" y="25" class="head">&lt;SYNC_ENGINE_DATA_DIR&gt;/&lt;taskId&gt;/&lt;channel?&gt;/</text>
    <text x="34" y="53" class="body">├─ .owner.lock</text><text x="236" y="53" class="small">进程文件锁；同目录只允许一个活跃 Worker</text>
    <text x="34" y="72" class="body">├─ full.rdb.enc　├─ full.meta　└─ commands-00000000.seg ... commands-000000NN.seg</text>
  </g>
  <g transform="translate(1105 177)">
    <rect x="0" y="0" width="412" height="82" rx="9" class="node-red"/>
    <text x="18" y="27" class="head">实现边界</text>
    <text x="18" y="50" class="small">无 command manifest；恢复时列出并排序</text>
    <text x="18" y="69" class="small">commands-XXXXXXXX.seg，逐记录校验</text>
  </g>

  <!-- zones -->
  <rect x="42" y="316" width="420" height="605" rx="18" class="write"/>
  <text x="65" y="350" class="section">② 写入路径</text>
  <rect x="486" y="316" width="610" height="605" rx="18" class="disk"/>
  <text x="509" y="350" class="section">③ 落盘格式与分段规则</text>
  <rect x="1120" y="316" width="438" height="605" rx="18" class="read"/>
  <text x="1143" y="350" class="section">④ 恢复与回收</text>

  <!-- writer -->
  <rect x="68" y="383" width="368" height="96" rx="11" class="node-orange"/>
  <text x="88" y="412" class="head">FULLRESYNC：RDB 输入流</text>
  <text x="88" y="436" class="small">固定长度或 diskless EOF；64 KiB 块流式复制</text>
  <text x="88" y="456" class="small">RDB 传输完成前不暴露为可重放文件</text>
  <rect x="68" y="531" width="368" height="118" rx="11" class="node-orange"/>
  <text x="88" y="560" class="head">增量：完整 RESP 命令 + offset</text>
  <text x="88" y="584" class="small">构造 startOffset / endOffset / RESP wire bytes</text>
  <text x="88" y="604" class="small">预估密文记录大小；超过 segmentBytes 则 rotate</text>
  <text x="88" y="624" class="small">空分段允许放入一条大命令，可能超过阈值</text>
  <rect x="68" y="699" width="368" height="160" rx="11" class="node-orange"/>
  <text x="88" y="728" class="head">持久化后才 ACK</text>
  <text x="88" y="752" class="small">1. append 记录 → flush → FileChannel.force(false)</text>
  <text x="88" y="772" class="small">2. 更新 receivedOffset = command.endOffset</text>
  <text x="88" y="792" class="small">3. REPLCONF ACK 到源 Redis</text>
  <rect x="88" y="810" width="238" height="25" rx="12" class="tag warn"/><text x="101" y="827" class="tiny">容量达 90%：停止继续读取源端</text>

  <!-- disk files -->
  <rect x="516" y="383" width="250" height="219" rx="10" class="file"/>
  <rect x="516" y="383" width="250" height="31" rx="10" class="file-head"/>
  <text x="535" y="405" class="head">full.rdb.enc</text>
  <text x="535" y="435" class="body">RSP1 magic（4 bytes）</text>
  <text x="535" y="457" class="body">随机 IV（12 bytes）</text>
  <text x="535" y="481" class="body">AES-256-GCM ciphertext</text>
  <text x="535" y="503" class="body">GCM tag（16 bytes，尾部）</text>
  <line x1="535" y1="519" x2="744" y2="519" class="divider"/>
  <text x="535" y="542" class="small">写入 .tmp → force(true) → 原子改名</text>
  <text x="535" y="563" class="small">AAD：taskId + rdb</text>
  <rect x="790" y="383" width="274" height="109" rx="10" class="file"/>
  <rect x="790" y="383" width="274" height="31" rx="10" class="file-head"/>
  <text x="809" y="405" class="head">full.meta</text>
  <text x="809" y="436" class="body">replicationId</text>
  <text x="809" y="458" class="body">baseOffset</text>
  <text x="809" y="480" class="small">临时文件写入后原子替换</text>
  <text x="790" y="521" class="small">全量成功应用后删除 RDB 与 meta</text>

  <rect x="516" y="642" width="548" height="217" rx="10" class="file"/>
  <rect x="516" y="642" width="548" height="31" rx="10" class="file-head"/>
  <text x="535" y="664" class="head">commands-000000NN.seg：重复追加的加密命令记录</text>
  <text x="535" y="697" class="body">[ int32 recordLength ] [ 12-byte IV ] [ AES-GCM ciphertext + 16-byte tag ]</text>
  <line x1="535" y1="716" x2="1040" y2="716" class="divider"/>
  <text x="535" y="741" class="head">解密后的 payload</text>
  <text x="535" y="766" class="body">int64 startOffset | int64 endOffset | int64 CRC32 | int32 RESP length | RESP command bytes</text>
  <text x="535" y="793" class="small">AAD：redis-ops:sync-spool:&lt;taskId&gt;:command:&lt;segmentNo&gt;；每条记录独立随机 IV。</text>
  <text x="535" y="818" class="small">分段按文件名排序；单记录不会跨分段。目录实际字节数超过 spoolLimitBytes 时失败关闭。</text>
  <text x="535" y="841" class="small">不在文件名、元数据、日志或图中保存密码、主密钥、原始业务命令或 Value。</text>

  <!-- writer arrows -->
  <path d="M436 431 H516" class="arrow-orange"/>
  <path d="M436 590 H490 V750 H516" class="arrow-orange"/>
  <text x="447" y="579" class="tiny">编码、CRC、加密</text>
  <path d="M641 602 V642" class="arrow"/>
  <path d="M766 493 H790" class="arrow"/>

  <!-- reader -->
  <rect x="1146" y="383" width="386" height="85" rx="11" class="node-green"/>
  <text x="1166" y="412" class="head">1. prepare：取得 .owner.lock</text>
  <text x="1166" y="436" class="small">计算目录实际字节数；超过上限则拒绝继续</text>
  <rect x="1146" y="505" width="386" height="108" rx="11" class="node-green"/>
  <text x="1166" y="534" class="head">2. 重放本地命令分段</text>
  <text x="1166" y="558" class="small">按文件名升序读取 → GCM 认证 → CRC → RESP 数组解析</text>
  <text x="1166" y="578" class="small">仅保留 endOffset &gt; 目标 checkpoint 的命令</text>
  <text x="1166" y="598" class="small">每 100 条组成目标应用批次</text>
  <rect x="1146" y="650" width="386" height="102" rx="11" class="node-green"/>
  <text x="1166" y="679" class="head">3. 原子应用与回收</text>
  <text x="1166" y="703" class="small">业务命令与目标 checkpoint 同一原子提交</text>
  <text x="1166" y="723" class="small">仅删除已完全应用的非 active segment</text>
  <text x="1166" y="743" class="small">RDB 全量成功后 discardFullRdb()</text>
  <rect x="1146" y="789" width="386" height="104" rx="11" class="node-purple"/>
  <text x="1166" y="818" class="head">4. 继续复制或安全阻塞</text>
  <text x="1166" y="842" class="small">本地重放后以 checkpoint 执行 PSYNC</text>
  <text x="1166" y="862" class="small">backlog / replId 不可续传时不自动清空目标</text>
  <text x="1166" y="882" class="small">进入 BLOCKED_REQUIRES_FULL_RESYNC</text>
  <path d="M1064 750 H1146" class="arrow-green"/>
  <path d="M1339 468 V505" class="arrow-green"/>
  <path d="M1339 613 V650" class="arrow-green"/>
  <path d="M1339 752 V789" class="arrow-purple"/>

  <!-- bottom failure branches -->
  <rect x="42" y="951" width="1516" height="112" rx="16" class="recover"/>
  <text x="65" y="983" class="section">⑤ 接管与失败关闭分支</text>
  <rect x="65" y="1002" width="442" height="40" rx="8" class="node-green"/>
  <text x="82" y="1027" class="body">同机取得锁：优先验证并使用本地 RDB / commands 分段恢复</text>
  <rect x="532" y="1002" width="466" height="40" rx="8" class="node-purple"/>
  <text x="549" y="1027" class="body">旧 Worker 仍持锁：新 Worker 不并发读取，创建接管目录并尝试 PSYNC</text>
  <rect x="1023" y="1002" width="508" height="40" rx="8" class="node-red"/>
  <text x="1040" y="1027" class="body">GCM/CRC/截断/安全恢复失败：失败关闭，不自动清空目标</text>
  <path d="M1339 893 V951" class="dash"/>
</svg>
