<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850" role="img" aria-labelledby="title desc">
  <title id="title">Redis Governance Platform 总体逻辑架构</title>
  <desc id="desc">平台包含交互层、治理控制层、任务执行层、被管资源层和数据存储层，覆盖资产、同步、采集、扫描、校验、治理、告警和 AI 分析。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
    <style>.title{font:600 23px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#0f172a}.layer{font:600 14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#475569}.label{font:600 15px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#0f172a}.sub{font:400 12px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#475569}.box{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.4}.control{fill:#e0f2fe;stroke:#0284c7;stroke-width:1.5}.execute{fill:#f0fdf4;stroke:#16a34a;stroke-width:1.5}.resource{fill:#fff7ed;stroke:#ea580c;stroke-width:1.5}.platform{fill:#faf5ff;stroke:#9333ea;stroke-width:1.5}.line{fill:none;stroke:#64748b;stroke-width:1.5;marker-end:url(#arrow)}.bus{fill:none;stroke:#64748b;stroke-width:2}</style>
  </defs>
  <rect width="1400" height="850" fill="#fff"/><text x="700" y="35" text-anchor="middle" class="title">Redis Governance Platform 总体逻辑架构</text>

  <text x="25" y="92" class="layer">交互层</text>
  <rect x="180" y="58" width="340" height="62" rx="8" class="box"/><text x="350" y="84" text-anchor="middle" class="label">Web Console</text><text x="350" y="105" text-anchor="middle" class="sub">资产、任务、告警、治理与报告</text>
  <rect x="880" y="58" width="340" height="62" rx="8" class="platform"/><text x="1050" y="84" text-anchor="middle" class="label">AI 运维分析助手</text><text x="1050" y="105" text-anchor="middle" class="sub">原因、证据、风险与建议；不直接执行</text>
  <path d="M520 89H690V152" class="line"/><path d="M880 89H710V152" class="line"/>

  <text x="25" y="182" class="layer">API 与平台控制</text>
  <rect x="450" y="145" width="500" height="64" rx="8" class="control"/><text x="700" y="171" text-anchor="middle" class="label">Backend API / Application Services</text><text x="700" y="193" text-anchor="middle" class="sub">身份、RBAC、事务、幂等、API 契约、任务编排</text>
  <rect x="1000" y="145" width="290" height="64" rx="8" class="platform"/><text x="1145" y="171" text-anchor="middle" class="label">Rule · Approval · Audit</text><text x="1145" y="193" text-anchor="middle" class="sub">规则版本、审批与不可变审计</text>
  <path d="M950 177H1000" class="line"/><path d="M700 209V247" class="line"/>

  <text x="25" y="285" class="layer">治理领域模块</text>
  <rect x="85" y="248" width="170" height="72" rx="8" class="control"/><text x="170" y="276" text-anchor="middle" class="label">Metadata</text><text x="170" y="298" text-anchor="middle" class="sub">集群 · 节点 · 应用</text>
  <rect x="275" y="248" width="170" height="72" rx="8" class="control"/><text x="360" y="276" text-anchor="middle" class="label">Sync</text><text x="360" y="298" text-anchor="middle" class="sub">迁移 · 灾备 · 治理</text>
  <rect x="465" y="248" width="170" height="72" rx="8" class="control"/><text x="550" y="276" text-anchor="middle" class="label">Collector</text><text x="550" y="298" text-anchor="middle" class="sub">指标 · 连接 · 慢日志</text>
  <rect x="655" y="248" width="170" height="72" rx="8" class="control"/><text x="740" y="276" text-anchor="middle" class="label">Scan</text><text x="740" y="298" text-anchor="middle" class="sub">大 Key · TTL · 风险</text>
  <rect x="845" y="248" width="170" height="72" rx="8" class="control"/><text x="930" y="276" text-anchor="middle" class="label">Validation</text><text x="930" y="298" text-anchor="middle" class="sub">存在 · 类型 · TTL · 摘要</text>
  <rect x="1035" y="248" width="170" height="72" rx="8" class="control"/><text x="1120" y="276" text-anchor="middle" class="label">Governance</text><text x="1120" y="298" text-anchor="middle" class="sub">TTL 填充 · 数据清理</text>
  <rect x="1225" y="248" width="150" height="72" rx="8" class="control"/><text x="1300" y="276" text-anchor="middle" class="label">Alert</text><text x="1300" y="298" text-anchor="middle" class="sub">规则 · 收敛 · 通知</text>
  <path d="M170 320V360H1300V320" class="bus"/><path d="M360 320V360M550 320V360M740 320V360M930 320V360M1120 320V360" class="bus"/>
  <path d="M700 360V404" class="line"/>

  <text x="25" y="445" class="layer">任务执行层</text>
  <rect x="175" y="405" width="1050" height="88" rx="8" class="execute"/><text x="700" y="433" text-anchor="middle" class="label">Worker Service / Scheduler</text><text x="700" y="457" text-anchor="middle" class="sub">租约 · 心跳 · 重试 · 幂等 · Checkpoint · 取消 · 集群级限速</text><text x="700" y="478" text-anchor="middle" class="sub">discovery ｜ collector ｜ sync-control ｜ scan ｜ validation ｜ governance</text>
  <path d="M700 493V535" class="line"/>

  <text x="25" y="576" class="layer">采集与被管资源</text>
  <rect x="115" y="537" width="260" height="78" rx="8" class="resource"/><text x="245" y="567" text-anchor="middle" class="label">受管 Redis</text><text x="245" y="591" text-anchor="middle" class="sub">Standalone · Sentinel · Cluster</text>
  <rect x="430" y="537" width="260" height="78" rx="8" class="resource"/><text x="560" y="567" text-anchor="middle" class="label">Sync Tool</text><text x="560" y="591" text-anchor="middle" class="sub">统一控制与状态适配端口</text>
  <rect x="745" y="537" width="260" height="78" rx="8" class="resource"/><text x="875" y="567" text-anchor="middle" class="label">Collector / App SDK</text><text x="875" y="591" text-anchor="middle" class="sub">Server、CLIENT LIST、客户端指标</text>
  <rect x="1060" y="537" width="260" height="78" rx="8" class="resource"/><text x="1190" y="567" text-anchor="middle" class="label">未来 Access Layer</text><text x="1190" y="591" text-anchor="middle" class="sub">流量、命令、Pattern 与热 Key</text>
  <path d="M245 615V660M560 615V660M875 615V660M1190 615V660" class="bus"/><path d="M245 660H1190" class="bus"/><path d="M700 660V695" class="line"/>

  <text x="25" y="735" class="layer">存储与外部集成</text>
  <rect x="75" y="697" width="230" height="82" rx="8" class="box"/><text x="190" y="728" text-anchor="middle" class="label">MySQL</text><text x="190" y="752" text-anchor="middle" class="sub">元数据 · 任务 · 审批 · 审计</text>
  <rect x="335" y="697" width="230" height="82" rx="8" class="box"/><text x="450" y="728" text-anchor="middle" class="label">Prometheus / TSDB</text><text x="450" y="752" text-anchor="middle" class="sub">Redis · 同步 · Worker 指标</text>
  <rect x="595" y="697" width="230" height="82" rx="8" class="box"/><text x="710" y="728" text-anchor="middle" class="label">日志 / 对象存储</text><text x="710" y="752" text-anchor="middle" class="sub">日志摘要与大型治理报告</text>
  <rect x="855" y="697" width="230" height="82" rx="8" class="box"/><text x="970" y="728" text-anchor="middle" class="label">App Master Key (Env)</text><text x="970" y="752" text-anchor="middle" class="sub">AES-GCM 版本化密钥环</text>
  <rect x="1115" y="697" width="230" height="82" rx="8" class="box"/><text x="1230" y="728" text-anchor="middle" class="label">SSO / 告警渠道</text><text x="1230" y="752" text-anchor="middle" class="sub">身份、邮件、IM、电话</text>
  <text x="700" y="822" text-anchor="middle" class="sub">旁路控制面：平台不可用不影响业务应用直接访问 Redis</text>
</svg>
